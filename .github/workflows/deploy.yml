# Build, test and deploy UrlPreviewApp to Azure App Service (Linux) on every push to main.
# Setup (Azure resources, OIDC, secrets): see deploy.md.
name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # UseLocalUrlPreviewParser defaults to false: UrlPreviewParser comes from NuGet, no sibling repo needed.
      - name: Restore
        run: dotnet restore UrlPreviewApp.slnx

      - name: Build
        run: dotnet build UrlPreviewApp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test UrlPreviewApp.slnx -c Release --no-build

      - name: Publish
        run: dotnet publish src/UrlPreviewApp -c Release -o ${{ runner.temp }}/publish --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ runner.temp }}/publish
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write # OIDC login to Azure
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ runner.temp }}/publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/publish
