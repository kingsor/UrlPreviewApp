# Build, test and deploy UrlPreviewApp to DigitalOcean App Platform on every push to main.
# App spec: .do/app.yaml. Setup (token, GitHub access, DNS): see deploy.md.
name: Deploy to DigitalOcean App Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # UseLocalUrlPreviewParser defaults to false: UrlPreviewParser comes from NuGet, no sibling repo needed.
      - name: Restore
        run: dotnet restore UrlPreviewApp.slnx

      - name: Build
        run: dotnet build UrlPreviewApp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test UrlPreviewApp.slnx -c Release --no-build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://urlpreview.neetpiq.com
    steps:
      - uses: actions/checkout@v4

      # Creates the app from .do/app.yaml on the first run, then updates it and waits for the deployment.
      # App Platform builds the image itself from the Dockerfile in the repository.
      - uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
